<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>内蒙古自治区安全生产培训一体化监管系统</title>
    <style>
        body {
            font-family: Inter, -apple-system, BlinkMacSystemFont, PingFang SC, Hiragino Sans GB, noto sans, Microsoft YaHei, Helvetica Neue, Helvetica, Arial, sans-serif;
            font-size: 14px;
        }

        .abox{
            padding-left: .5rem;
            padding-right: .5rem;
            max-width: 42rem;
            margin: auto;
        }
        .bbox{
            padding-bottom: .3rem;
            min-height: 100vh;
        }
        .userInfo{
            border-width:1px;
            width:100%;
            font-size:14px;
            background:#fff;
            border-radius:0;
            position:relative;
        }
        .userHeader{
            padding: 10px 16px;
            align-items: center;
            border-bottom: 1px solid rgb(229,230,235);
        }
        .userBody{
            padding: 16px;
            color:rgb(78,89,105)
        }
        .arco-descriptions-table{
            border-collapse:collapse;
            width:100%;
        }
        .arco-descriptions-item-label-block{
            text-align: left;
            font-size: 14px;
            padding-bottom: 16px;
            padding-right: 20px;
            color:rgb(134,144,156);
            font-weight: 500;
            padding: 0 20px 16px 0;
            white-space: nowrap;
            width: 1px;
        }
        .arco-descriptions-item-value-block{
            color: rgb(29,33,41);
            font-weight: 400;
            padding: 0 4px 12px 0;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .arco-divider-horizontal{
            border-bottom: 1px solid rgb(229,230,235);
            clear: both;
            margin: 20px 0;
            max-width: 100%;
            min-width: 100%;
            position: relative;
            width: 100%;
        }
        .infoBottom{
            width: 100%;
            font-size: 14px;
            background:#fff;
            position:relative;
        }
        .arco-card-body{
            padding:16px;
            color:rgb(78,89,105);
        }
    </style>
</head>
<body>
    <div class="container">
        <div>
            <div class="abox">
                <div class="bbox">
                    <div class="userInfo">
                        <div class="userHeader">
                            <div style="font-size: 16px;color: rgb(29,33,41);font-weight: 500;line-height: 1.5715;flex: 1;">用户信息</div>
                        </div>
                        <div class="userBody">
                            <div style="padding-bottom: 3rem;position: relative;">
                                <div style="width: 120px;position: relative;">
                                    <img src="./610221200310253613.jpg" style="width: 120px;border-radius:inherit;border-style:none;">
                                </div>
                            </div>
                            <div>
                                <div>
                                    <table class="arco-descriptions-table">
                                        <tbody>
                                            <tr>
                                                <td class="arco-descriptions-item-label-block">用户姓名</td>
                                                <td class="arco-descriptions-item-value-block">阴飞航</td>
                                            </tr>
                                            <tr>
                                                <td class="arco-descriptions-item-label-block">证件号码</td>
                                                <td class="arco-descriptions-item-value-block">610221200310253613</td>
                                            </tr>
                                            <tr>
                                                <td class="arco-descriptions-item-label-block">工作岗位</td>
                                                <td class="arco-descriptions-item-value-block">信号把钩工</td>
                                            </tr>
                                            <tr>
                                                <td class="arco-descriptions-item-label-block">企业名称</td>
                                                <td class="arco-descriptions-item-value-block">内蒙古大唐国际准格尔矿业有限公司</td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div role="separator" class="arco-divider-horizontal"></div>
                    <div class="infoBottom">
                        <div class="arco-card-body">
                            <div style="display: flex;flex-direction: column;">
                                <div style="border: 1px solid rgb(229,230,235);border-radius: 4px;overflow: hidden;">
                                    <table style="border-collapse: collapse;width: 100%;">
                                        <tbody>
                                            <tr style="border-bottom:1px solid rgb(229,230,235);height: 40px;">
                                                <td style="color:rgb(134,144,156);padding: 9px 20px;background-color:rgb(247,248,250);border-right:1px solid rgb(229,230,235);width: 59px;">培训时间</td>
                                                <td style="padding: 9px 20px;color: rgb(29,33,41);">2026-06-22至2026-06-30</td>
                                            </tr>
                                            <tr style="border-bottom:1px solid rgb(229,230,235);height: 40px;">
                                                <td style="color:rgb(134,144,156);padding: 9px 20px;background-color:rgb(247,248,250);border-right:1px solid rgb(229,230,235);width: 59px;">班级名称</td>
                                                <td style="padding: 9px 20px;color: rgb(29,33,41);">分校2026年505期</td>
                                            </tr>
                                            <tr style="border-bottom:1px solid rgb(229,230,235);height: 40px;">
                                                <td style="color:rgb(134,144,156);padding: 9px 20px;background-color:rgb(247,248,250);border-right:1px solid rgb(229,230,235);width: 59px;">培训单位</td>
                                                <td style="padding: 9px 20px;color: rgb(29,33,41);">国家矿山安全监察局内蒙古局安全培训中心鄂尔多斯分校</td>
                                            </tr>
                                            <tr style="border-bottom:1px solid rgb(229,230,235);height: 40px;">
                                                <td style="color:rgb(134,144,156);padding: 9px 20px;background-color:rgb(247,248,250);border-right:1px solid rgb(229,230,235);width: 59px;">课时数</td>
                                                <td style="padding: 9px 20px;color: rgb(29,33,41);">72</td>
                                            </tr>
                                            <tr style="height: 40px;">
                                                <td style="color:rgb(134,144,156);padding: 9px 20px;background-color:rgb(247,248,250);border-right:1px solid rgb(229,230,235);width: 59px;">成绩</td>
                                                <td style="padding: 9px 20px;color: rgb(29,33,41);">95</td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div role="separator" class="arco-divider-horizontal"></div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
